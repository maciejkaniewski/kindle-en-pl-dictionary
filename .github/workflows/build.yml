name: Build dictionary

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE", "LICENSE-DATA"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "LICENSE-DATA"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-24.04 ships glibc 2.39, which the prebuilt kindling binary expects
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # needed to publish releases on version tags
    steps:
      - uses: actions/checkout@v7

      # The Wiktionary dumps (~3.3 GB) are cached and refreshed once a month.
      - name: Data cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: data/raw
          key: kaikki-${{ steps.month.outputs.month }}

      - name: Download data and kindling
        run: tools/download.sh

      - name: Build and run lookup tests
        run: make test

      - name: Corrections status
        run: python3 -I tools/corrections.py stats

      - uses: actions/upload-artifact@v7
        with:
          name: kindle-en-pl-dictionary
          path: |
            build/full/kindle-en-pl-dictionary.mobi
            build/full/stats.json
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 -I - > notes.md <<'EOF'
          import json
          s = json.load(open("build/full/stats.json"))
          print(f"English → Polish dictionary for Kindle, built from Wiktionary data on {s['date']}.\n")
          print(f"- {s['entries']:,} entries")
          print(f"- {s['inflected_forms']:,} inflected forms")
          print(f"- {s['phrasal_verbs']:,} phrasal verbs")
          print(f"- {s['corrections_applied']:,} reviewed corrections of Polish text\n")
          print("Installation: copy `kindle-en-pl-dictionary.mobi` to `documents/dictionaries/` "
                "on the Kindle over USB, then choose it under Settings → Language & Dictionaries "
                "→ Dictionaries → English. See the README for details.")
          EOF
          gh release create "$TAG" build/full/kindle-en-pl-dictionary.mobi \
            --title "$TAG" --notes-file notes.md
